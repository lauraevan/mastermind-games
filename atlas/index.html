<!-- Atlas -->
<title>Atlas</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vault.css">
<script>
  /* Front-door only. If you did not arrive through the steps, you were never here. */
  (function () {
    try { if (localStorage.getItem('mm_pass') !== '1') { location.replace('../index.html'); } }
    catch (e) { location.replace('../index.html'); }
  })();
</script>

<!-- ===================== GATE ===================== -->
<section id="gate">
  <div class="lock">
    <h1 class="obf">Mastermind</h1>
    <p class="sub">Break the four-colour code to continue. Ten attempts. Filled dots = right colour &amp; place; pale dots = right colour, wrong place.</p>
    <div class="rows" id="rows"></div>
    <div class="palette" id="palette"></div>
    <div class="lock-actions">
      <button class="vbtn ghost" id="clearBtn">Clear</button>
      <button class="vbtn" id="checkBtn" disabled>Check</button>
    </div>
    <div class="note" id="note"></div>
  </div>
</section>

<!-- ===================== VAULT ===================== -->
<section id="vault" hidden>
  <div class="v-top">
    <div class="v-top-in">
      <span class="v-mark"></span>
      <span class="v-title obf" aria-label="Atlas">Atlas</span>
      <span class="v-search"><input id="search" type="search" spellcheck="false" autocomplete="off" placeholder="Filter…"></span>
      <span class="v-count" id="count">…</span>
      <a class="src-chip" href="../dashboard.html" title="return" style="text-decoration:none">↩</a>
    </div>
    <div class="v-sources" id="sources"></div>
  </div>

  <div class="v-loading" id="vLoading" style="display:none">
    <div class="spinner"></div>
    <div class="obf">Loading the shelves…</div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="more-wrap"><button id="more" style="display:none">Show more</button></div>
</section>

<!-- fullscreen viewer -->
<div class="ov" id="ov">
  <div class="ov-bar">
    <span class="t obf" id="ovTitle"></span>
    <button id="ovClose">✕ Close</button>
  </div>
  <iframe id="ovFrame" src="about:blank" allow="autoplay; fullscreen; gamepad; microphone; clipboard-write"
    allowfullscreen referrerpolicy="no-referrer"></iframe>
</div>

<!-- catalog first (registers the reveal hook), then the gate that calls it -->
<script src="catalog.js"></script>
<script src="gate.js"></script>
