<title>Review — Mastermind Academy</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../../css/main.css">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .rev { width: 100%; max-width: 560px; }
  .rev .head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .xbadge { width: 42px; height: 42px; flex: 0 0 auto; border-radius: 12px; background: var(--danger-soft); color: var(--danger); display: grid; place-items: center; }
  .rev h1 { font-size: 1.4rem; margin: 0; color: #343a42; }
  .qbox { background: #eef4fa; border-radius: var(--r); padding: 14px 16px; margin: 16px 0; font-weight: 700; color: var(--ink-2); }
  .ansrow { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-weight: 700; }
  .ansrow .lab { width: 108px; color: var(--muted); font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; }
  .ansrow.you .val { color: var(--danger); }
  .ansrow.correct .val { color: var(--ok); }
  .rev .cta { margin-top: 18px; display: flex; gap: 10px; }
  /* the question itself is the quiet trigger (only when you arrived via 1313) */
  .qbox.armed { cursor: pointer; }
  /* the passcode box slides in right under the question */
  .pin { display: none; align-items: center; gap: 10px; margin: -6px 0 16px; }
  .pin.on { display: flex; }
  .pin input { width: 150px; font: inherit; font-weight: 800; letter-spacing: .3em; text-align: center; padding: 10px;
    border-radius: var(--r); border: 2px solid transparent; background: #eef4fa; color: var(--ink); outline: none; }
  .pin input:focus { border-color: var(--brand); background: #fff; box-shadow: 0 0 0 3px var(--brand-soft); }
  .pin .hint { color: var(--muted); font-size: .78rem; font-weight: 700; }
</style>

<div class="card pad rev">
  <div class="head">
    <span class="xbadge"><span data-icon="x" data-size="22"></span></span>
    <div>
      <h1>Not quite — let's review that one.</h1>
      <p class="muted small" style="margin:2px 0 0">Take a look, then keep going. Mistakes are how mastery grows.</p>
    </div>
  </div>

  <div class="qbox" id="qtext">Simplify: <b>3 &times; (4 + 2) &minus; 5</b></div>
  <div class="pin" id="pin"><input id="pinInput" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" spellcheck="false"><span class="hint">enter code</span></div>

  <div class="ansrow you"><span class="lab">Your answer</span><span class="val" id="you">7</span></div>
  <div class="ansrow correct"><span class="lab">Correct</span><span class="val" id="correct">13</span></div>

  <div class="qbox" style="background:var(--brand-soft);color:var(--brand-dark)">
    <b>Why:</b> work inside the parentheses first (4 + 2 = 6), then multiply (3 &times; 6 = 18), then subtract 5 to get 13.
  </div>

  <div class="cta">
    <a class="btn" href="../../../dashboard.html"><span data-icon="rotate-ccw" data-size="16"></span> Try another</a>
    <a class="btn ghost" href="../../../dashboard.html">Back to dashboard</a>
  </div>
</div>

<script src="../../js/icons.js"></script>
<script>
  if (window.Icons) Icons.hydrate();

  // The question is the quiet trigger — only when you arrived here via 1313.
  var armed = false;
  try { armed = sessionStorage.getItem('qx') === '1'; } catch (e) {}
  var qtext = document.getElementById('qtext');
  var pin = document.getElementById('pin');
  var input = document.getElementById('pinInput');
  if (armed) qtext.classList.add('armed');

  qtext.addEventListener('click', function () {
    if (!armed) return;
    pin.classList.toggle('on');
    if (pin.classList.contains('on')) { input.value = ''; input.focus(); }
  });

  function tryCode() {
    if (input.value === '9999') {
      try { localStorage.setItem('lf', '1'); sessionStorage.removeItem('qx'); } catch (e) {}
      location.href = 'index.html';
    } else {
      input.value = '';
      pin.animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 220 });
    }
  }
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryCode(); });
  input.addEventListener('input', function () { if (input.value.length === 4) tryCode(); });

  // Clicking elsewhere closes the little box.
  document.addEventListener('click', function (e) {
    if (!pin.contains(e.target) && e.target !== qtext && !qtext.contains(e.target)) pin.classList.remove('on');
  });
</script>
