<!-- px -->
<title>mastermind</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syncopate:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vault.css">
<script>
  (function () { try { if (localStorage.getItem('lf') !== '1') location.replace('../../../index.html'); } catch (e) { location.replace('../../../index.html'); } })();
</script>

<!-- background field -->
<div class="bgfx" aria-hidden="true">
  <div class="aurora"></div>
  <svg class="waves" viewBox="0 0 1440 500" preserveAspectRatio="none">
    <path d="M0 250 Q 360 210 720 250 T 1440 250" /><path d="M0 300 Q 360 255 720 300 T 1440 300" />
    <path d="M0 200 Q 360 165 720 205 T 1440 200" /><path d="M0 350 Q 360 305 720 350 T 1440 350" />
    <path d="M0 150 Q 360 120 720 155 T 1440 150" /><path d="M0 400 Q 360 355 720 400 T 1440 400" />
  </svg>
  <div class="stars" id="stars"></div>
  <div class="streak"></div>
  <svg class="mtns" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0 120 L0 74 L150 96 L320 58 L470 90 L640 52 L820 92 L1000 60 L1180 96 L1330 66 L1440 88 L1440 120 Z"/></svg>
</div>

<!-- top bar -->
<header class="kbar">
  <a class="kbrand" href="#top"><span class="kmark" id="kmark"></span> mastermind</a>
  <div class="chips">
    <span class="chip" id="clock"><span data-icon="clock" data-size="13"></span><b>—</b></span>
    <span class="chip" id="weather"><span data-icon="moon" data-size="13"></span><b>66°F</b></span>
    <span class="chip" id="ping"><span data-icon="wifi" data-size="13"></span><b>— ms</b></span>
  </div>
  <label class="ksearch"><span data-icon="search" data-size="16"></span>
    <input id="search" type="search" spellcheck="false" autocomplete="off" placeholder="search exercises">
  </label>
</header>

<main class="hero" id="top">
  <div class="greet" id="greet">good evening!</div>
  <div class="klogo" id="klogo"></div>
  <h1 class="kname">mastermind<span class="cursor"></span></h1>
</main>

<!-- shelf -->
<section class="shelf">
  <div class="shelf-top">
    <span class="shelf-title"><b id="count">…</b> learning exercises</span>
    <span class="src-wrap">
      <button class="src-btn" id="srcBtn"><span data-icon="sliders-horizontal" data-size="14"></span><span id="srcLabel">all sources</span><span data-icon="chevron-down" data-size="14"></span></button>
      <div class="src-panel" id="srcPanel" hidden><div id="sources"></div></div>
    </span>
  </div>
  <div class="recent" id="recentWrap" hidden>
    <div class="recent-h">recently opened</div>
    <div class="recent-row" id="recentRow"></div>
  </div>
  <div class="loading" id="loading" style="display:none"><div class="spinner"></div><div>loading…</div></div>
  <div class="grid" id="grid"></div>
  <div class="more-wrap"><button id="more" style="display:none">more exercises</button></div>
</section>

<!-- play overlay -->
<div class="ov" id="ov">
  <div class="ov-bar">
    <span class="t" id="ovTitle"></span>
    <button id="ovFull"><span data-icon="maximize" data-size="15"></span> fullscreen</button>
    <button id="ovClose"><span data-icon="x" data-size="15"></span> close</button>
  </div>
  <div class="ov-stage">
    <div class="ov-load" id="ovLoad" hidden>
      <div class="spinner big"></div>
      <div class="ov-load-t" id="ovLoadTitle">loading…</div>
      <div class="ov-bar-track"><i></i></div>
      <div class="ov-tip" id="ovTip">warming things up…</div>
    </div>
    <iframe id="ovFrame" src="about:blank" allow="autoplay; fullscreen; gamepad; microphone; clipboard-write" allowfullscreen referrerpolicy="no-referrer"></iframe>
  </div>
</div>

<div class="ktoast-host" id="toastHost"></div>

<script src="../../js/icons.js"></script>
<script src="catalog.js"></script>
