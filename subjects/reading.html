<title>Practice — Mastermind Academy</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/practice.css">

<div id="nav"></div>

<main class="prac wrap">
  <div class="prac-head">
    <div class="ic" id="subIcon"></div>
    <div>
      <h1 id="subName">Subject</h1>
      <p id="subBlurb"></p>
    </div>
    <div class="spacer"></div>
    <a class="btn ghost sm" href="../dashboard.html"><span data-icon="arrow-left" data-size="15"></span> Dashboard</a>
    <span class="tag" id="subGradeTag">Grade</span>
  </div>

  <div class="prac-cols">
    <aside class="skill-panel">
      <h3>Skills</h3>
      <div id="skillList"></div>
    </aside>

    <section>
      <div class="practice-empty" id="practiceEmpty">
        <div class="big"><span data-icon="list-checks" data-size="40"></span></div>
        <h2>Select a skill to begin</h2>
        <p>Choose a skill from the list. Difficulty adjusts automatically as you work.</p>
      </div>

      <div class="practice-card" id="practiceCard" style="display:none">
        <div class="q-top">
          <div><span class="tag accent" id="skillTag">Subject</span>
            <h2 id="skillTitle">Skill</h2>
            <span class="adapt-tag" id="adaptTag"></span>
          </div>
          <div class="mastery"><span class="bar"><i id="masteryBar" style="width:3%"></i></span>
            <span class="muted small" id="masteryText" style="white-space:nowrap">0%</span></div>
        </div>

        <div class="question" id="questionText"></div>
        <div id="answerArea"></div>
        <div class="feedback" id="feedback" style="display:none"></div>

        <div class="prac-actions">
          <button class="btn" id="nextBtn" style="display:none">Next <span data-icon="arrow-right" data-size="16"></span></button>
        </div>

        <div class="session-bar">
          <div class="sc"><b id="sesSolved">0</b><span>Answered</span></div>
          <div class="sc"><b id="sesAcc">0%</b><span>Accuracy</span></div>
          <div class="sc"><b id="sesXP">0</b><span>XP</span></div>
          <div class="sc"><b id="sesRun">0</b><span>Streak</span></div>
        </div>
      </div>
    </section>
  </div>
</main>

<div class="toast-host"></div>
<div id="footer"></div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/problems.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/hidden.js"></script>
<script>window.SUBJECT_ID = "reading"; Layout.mount({ active: 'subjects' });</script>
<script src="../assets/js/practice.js"></script>
